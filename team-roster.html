<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1BE Team - Состав команды</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            color: #ffffff;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                       url('https://wallpapercave.com/wp/wp6757002.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7));
            padding: 40px 20px 100px;
            text-align: center;
            position: relative;
            border-bottom: 4px solid #ff4d4d;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .logo-text {
            font-size: 4em;
            font-weight: bold;
            color: #ff4d4d;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
            letter-spacing: 2px;
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(45deg, #ff4d4d, #ffad4d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,77,77,0.5));
        }

        .logo-text span {
            display: inline-block;
            transform: skew(-10deg);
        }

        .logo-small {
            position: absolute;
            width: 80px;
            height: auto;
            top: 50%;
            transform: translateY(-50%);
            right: -90px;
            filter: drop-shadow(0 0 8px rgba(255,77,77,0.4));
        }

        .nav {
            background: rgba(42, 42, 42, 0.9);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
            border-bottom: 2px solid #ff4d4d;
        }

        .nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2em;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav a:hover {
            background: #404040;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-align: center;
            color: #ff4d4d;
        }

        .team-roster {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 77, 77, 0.2);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 77, 77, 0.5);
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-size: 1.5em;
            color: #ffad4d;
            margin-bottom: 10px;
        }

        .player-number {
            color: #ff4d4d;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .tank-silhouette {
            width: 120px;
            height: auto;
            filter: invert(1);
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .player-card:hover .tank-silhouette {
            opacity: 1;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .logo-text {
                font-size: 3em;
            }

            .logo-small {
                width: 60px;
                right: -70px;
            }

            .nav ul {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .player-card {
                flex-direction: column;
                text-align: center;
            }

            .tank-silhouette {
                width: 100px;
            }
        }
    </style>
</head>
