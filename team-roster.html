<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1BE Team - Состав команды</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            color: #ffffff;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                       url('https://wallpapercave.com/wp/wp6757002.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7));
            padding: 40px 20px 100px;
            text-align: center;
            position: relative;
            border-bottom: 4px solid #ff4d4d;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .logo-text {
            font-size: 4em;
            font-weight: bold;
            color: #ff4d4d;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
            letter-spacing: 2px;
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(45deg, #ff4d4d, #ffad4d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,77,77,0.5));
        }

        .logo-text span {
            display: inline-block;
            transform: skew(-10deg);
        }

        .logo-small {
            position: absolute;
            width: 80px;
            height: auto;
            top: 50%;
            transform: translateY(-50%);
            right: -90px;
            filter: drop-shadow(0 0 8px rgba(255,77,77,0.4));
        }

        .nav {
            background: rgba(42, 42, 42, 0.9);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
            border-bottom: 2px solid #ff4d4d;
        }

        .nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2em;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav a:hover {
            background: #404040;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .team-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff4d4d, #ffad4d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .tank-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 10px;
            padding: 20px;
            transform: scale(0.95);
        }

        .tank-preview img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 77, 77, 0.5));
            transform: scale(0.95);
            transition: all 0.3s ease;
        }

        .player-card:hover .tank-preview {
            opacity: 1;
            transform: scale(1);
        }

        .player-card:hover .tank-preview img {
            transform: scale(1);
        }

        .player-card:hover .player-avatar {
            opacity: 0;
        }

        .player-avatar {
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .player-name {
            color: #ff4d4d;
            margin: 0 0 5px 0;
            font-size: 1.2em;
        }

        .player-role {
            color: #ffad4d;
            margin: 0;
            font-size: 0.9em;
        }

        .section-title {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-align: center;
            color: #ff4d4d;
        }

        @media (max-width: 768px) {
            .logo-text {
                font-size: 3em;
            }

            .logo-small {
                width: 60px;
                right: -70px;
            }

            .nav ul {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .team-section {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <h1 class="logo-text"><span>V1BE</span></h1>
            <img src="images/v1be-logo-tank.png" alt="V1BE Tank Logo" class="logo-small">
        </div>
    </header>

    <nav class="nav">
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="team-roster.html">Состав команды</a></li>
            <li><a href="clan-history.html">История кланов</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 class="section-title">Состав команды</h2>
        <div class="team-section">
            <div class="player-card">
                <div class="player-avatar">KV</div>
                <div class="tank-preview">
                    <img src="assets/tanks/obj-279.svg" alt="Object 279 early">
                </div>
                <h3 class="player-name">KirillValentinov</h3>
                <p class="player-role">Командир</p>
            </div>

            <div class="player-card">
                <div class="player-avatar">DM</div>
                <div class="tank-preview">
                    <img src="assets/tanks/chieftain.svg" alt="T95/FV4201 Chieftain">
                </div>
                <h3 class="player-name">DarkMist</h3>
                <p class="player-role">Полевой командир</p>
            </div>

            <div class="player-card">
                <div class="player-avatar">SH</div>
                <div class="tank-preview">
                    <img src="assets/tanks/cs-63.svg" alt="CS-63">
                </div>
                <h3 class="player-name">Shadow</h3>
                <p class="player-role">Штурмовик</p>
            </div>

            <div class="player-card">
                <div class="player-avatar">PH</div>
                <div class="tank-preview">
                    <img src="assets/tanks/kranvagn.svg" alt="Kranvagn">
                </div>
                <h3 class="player-name">Phoenix</h3>
                <p class="player-role">Штурмовик</p>
            </div>

            <div class="player-card">
                <div class="player-avatar">VR</div>
                <div class="tank-preview">
                    <img src="assets/tanks/super-conqueror.svg" alt="Super Conqueror">
                </div>
                <h3 class="player-name">Vortex</h3>
                <p class="player-role">Поддержка</p>
            </div>

            <div class="player-card">
                <div class="player-avatar">ST</div>
                <div class="tank-preview">
                    <img src="assets/tanks/stb-1.svg" alt="STB-1">
                </div>
                <h3 class="player-name">Storm</h3>
                <p class="player-role">Разведчик</p>
            </div>
        </div>
    </div>
</body>
</html>
