<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World of Tanks Team</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            color: #ffffff;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                       url('https://wallpapercave.com/wp/wp6757002.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7));
            padding: 40px 20px 100px;
            text-align: center;
            position: relative;
            border-bottom: 4px solid #ff4d4d;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .logo-text {
            font-size: 4em;
            font-weight: bold;
            color: #ff4d4d;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
            letter-spacing: 2px;
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(45deg, #ff4d4d, #ffad4d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,77,77,0.5));
        }

        .logo-text span {
            display: inline-block;
            transform: skew(-10deg);
        }

        .logo-small {
            position: absolute;
            width: 80px;
            height: auto;
            top: 50%;
            transform: translateY(-50%);
            right: -90px;
            filter: drop-shadow(0 0 8px rgba(255,77,77,0.4));
        }

        .header h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: none;
        }

        .nav {
            background: rgba(42, 42, 42, 0.9);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
            border-bottom: 2px solid #ff4d4d;
        }

        .nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2em;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav a:hover {
            background: #404040;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .team-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff4d4d, #ffad4d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .tank-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 10px;
            padding: 20px;
            transform: scale(0.95);
        }

        .tank-preview img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 77, 77, 0.5));
            transform: scale(0.95);
            transition: all 0.3s ease;
        }

        .player-card:hover .tank-preview {
            opacity: 1;
            transform: scale(1);
        }

        .player-card:hover .tank-preview img {
            transform: scale(1);
        }

        .player-card:hover .player-avatar {
            opacity: 0;
        }

        .player-avatar {
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .player-name {
            color: #ff4d4d;
            margin: 0 0 5px 0;
            font-size: 1.2em;
        }

        .player-role {
            color: #ffad4d;
            margin: 0;
            font-size: 0.9em;
        }

        .section-title {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-align: center;
            color: #ff4d4d;
        }

        .clan-history-section {
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .clan-card {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .clan-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.3);
        }

        .clan-card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .clan-name {
            color: #ff4d4d;
            margin: 0 0 10px 0;
            font-size: 1.5em;
        }

        .clan-period {
            color: #888;
            margin: 5px 0;
            font-style: italic;
        }

        .clan-description {
            margin: 10px 0 0 0;
            line-height: 1.6;
        }

        /* Стили для текущего клана */
        .clan-card.current-clan {
            background: linear-gradient(135deg, rgba(255, 77, 77, 0.1) 0%, rgba(0, 0, 0, 0.7) 100%);
            border: 1px solid rgba(255, 77, 77, 0.3);
            position: relative;
            order: -1; /* Помещаем текущий клан в начало списка */
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clan-card.current-clan:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255, 77, 77, 0.4);
            background: linear-gradient(135deg, rgba(255, 77, 77, 0.2) 0%, rgba(0, 0, 0, 0.8) 100%);
        }

        .clan-card.current-clan a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .clan-card.current-clan::before {
            content: "Текущий клан";
            position: absolute;
            top: -12px;
            right: 20px;
            background: #ff4d4d;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .clan-history-container {
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5em;
            }

            .nav ul {
                flex-direction: column;
                align-items: center;
            }

            .team-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .logo-small {
                position: static;
                width: 60px;
                margin-top: 20px;
                transform: none;
            }
        }

        @media (max-width: 480px) {
            .team-section {
                grid-template-columns: 1fr;
            }
        }

        .main-logo {
            max-width: 300px;
            height: auto;
            border-radius: 10px;
            filter: drop-shadow(0 0 20px rgba(255,77,77,0.5));
            transition: transform 0.3s ease;
        }

        .main-logo:hover {
            transform: scale(1.05);
        }

        .tank-svg {
            width: 100%;
            height: 100%;
            color: #ff4d4d;
            transition: all 0.3s ease;
        }

        .player-card:hover .tank-svg {
            color: #ffad4d;
            transform: scale(1.1);
            filter: drop-shadow(0 0 5px currentColor);
        }
    </style>
</head>
<body>

        </div>
        <p>Профессиональная команда World of Tanks</p>

    <nav class="nav">
        <ul>

    </div>

    <script>
        // Плавная прокрутка к секциям
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
